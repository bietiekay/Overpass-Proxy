<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overpass Proxy Cache Invalidation</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light dark;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --panel-text: #f8fafc;
      --muted: #cbd5f5;
      --accent: #38bdf8;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: #0f172a;
      color: var(--panel-text);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: #0b1220;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      flex: 1;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--panel-text);
      padding: 0.45rem 0.65rem;
      border-radius: 0.45rem;
      min-width: 14rem;
    }

    button {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--panel-text);
      padding: 0.5rem 0.85rem;
      border-radius: 0.45rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover:enabled {
      background: #1f2937;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    button:active {
      transform: translateY(1px);
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
    }

    #map {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      z-index: 900;
      bottom: 1rem;
      left: 1rem;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      max-width: min(24rem, 90vw);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      font-size: 0.9rem;
    }

    .panel strong {
      color: var(--accent);
    }

    .bbox {
      font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, SFMono-Regular, monospace;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-top: 0.4rem;
      color: #e2e8f0;
      white-space: pre-line;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 600;
      z-index: 800;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .overlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Overpass Cache Invalidation</h1>
    <div class="controls">
      <label>
        Secret keyword
        <input id="secret" type="password" placeholder="Enter secret keyword" />
      </label>
      <button id="invalidate" disabled>Invalidate</button>
      <button id="clear" disabled>Clear selection</button>
      <span class="status" id="status">Enter the secret keyword to enable selection.</span>
    </div>
  </header>
  <main id="map">
    <div class="overlay visible" id="overlay">Enter the secret keyword to enable selection</div>
    <div class="panel">
      <div><strong>Selection:</strong> Shift + drag to draw a bounding box.</div>
      <div class="bbox" id="bbox-display">No selection yet.</div>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map('map', { boxZoom: true }).setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const secretInput = document.getElementById('secret');
    const invalidateButton = document.getElementById('invalidate');
    const clearButton = document.getElementById('clear');
    const statusEl = document.getElementById('status');
    const bboxDisplay = document.getElementById('bbox-display');
    const overlay = document.getElementById('overlay');

    let selectionRectangle = null;
    let selectedBounds = null;

    const updateStatus = (message, isError = false) => {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#fca5a5' : '';
    };

    const setSelection = (bounds) => {
      selectedBounds = bounds;
      if (selectionRectangle) {
        selectionRectangle.remove();
      }
      selectionRectangle = L.rectangle(bounds, { color: '#38bdf8', weight: 2, fillOpacity: 0.15 }).addTo(map);
      const south = bounds.getSouth().toFixed(6);
      const west = bounds.getWest().toFixed(6);
      const north = bounds.getNorth().toFixed(6);
      const east = bounds.getEast().toFixed(6);
      bboxDisplay.textContent = `south: ${south}\nwest:  ${west}\nnorth: ${north}\neast:  ${east}`;
      invalidateButton.disabled = !secretInput.value.trim();
      clearButton.disabled = false;
      updateStatus('Ready to invalidate selected bounding box.');
    };

    const clearSelection = () => {
      selectedBounds = null;
      if (selectionRectangle) {
        selectionRectangle.remove();
        selectionRectangle = null;
      }
      bboxDisplay.textContent = 'No selection yet.';
      invalidateButton.disabled = true;
      clearButton.disabled = true;
    };

    map.on('boxzoomend', (event) => {
      if (!secretInput.value.trim()) {
        return;
      }
      const bounds = event.boxZoomBounds || event.bounds;
      if (bounds) {
        setSelection(bounds);
      }
    });

    const toggleSelectionState = () => {
      const hasSecret = secretInput.value.trim().length > 0;
      overlay.classList.toggle('visible', !hasSecret);
      if (hasSecret) {
        map.boxZoom.enable();
        updateStatus('Hold Shift and drag to select a bounding box.');
      } else {
        map.boxZoom.disable();
        clearSelection();
        updateStatus('Enter the secret keyword to enable selection.');
      }
    };

    secretInput.addEventListener('input', toggleSelectionState);
    toggleSelectionState();

    clearButton.addEventListener('click', () => {
      clearSelection();
      updateStatus('Selection cleared. Draw a new bounding box.');
    });

    invalidateButton.addEventListener('click', async () => {
      if (!selectedBounds) {
        updateStatus('Select a bounding box first.', true);
        return;
      }
      const secret = secretInput.value.trim();
      if (!secret) {
        updateStatus('Enter the secret keyword.', true);
        return;
      }

      const payload = {
        secret,
        bbox: {
          south: selectedBounds.getSouth(),
          west: selectedBounds.getWest(),
          north: selectedBounds.getNorth(),
          east: selectedBounds.getEast()
        }
      };

      try {
        updateStatus('Sending invalidation request...');
        const response = await fetch('/api/cache/invalidate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          updateStatus(data.error || 'Invalidation failed.', true);
          return;
        }
        updateStatus(
          `Invalidated ${data.deletedKeys ?? 0} keys across ${data.tileCount ?? 0} tiles.`
        );
      } catch (error) {
        updateStatus('Invalidation request failed to send.', true);
      }
    });
  </script>
</body>
</html>
