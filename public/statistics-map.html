<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overpass Proxy Statistics Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light dark;
      --panel-bg: rgba(0, 0, 0, 0.65);
      --panel-text: #fff;
      --accent: #ff6b35;
      --muted: #9ca3af;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: #0f172a;
      color: var(--panel-text);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0b1220;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--panel-text);
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #1f2937;
    }

    button:active {
      transform: translateY(1px);
    }

    #map {
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 8rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem 0.75rem;
      border-radius: 0.35rem;
    }

    .stat strong {
      color: var(--panel-text);
      font-size: 1.05rem;
    }

    .legend {
      position: absolute;
      z-index: 900;
      bottom: 1rem;
      left: 1rem;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 0.65rem 0.8rem;
      border-radius: 0.4rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    .legend .scale {
      height: 0.75rem;
      width: 9rem;
      background: linear-gradient(90deg, #2dd36f 0%, #fbbf24 50%, #ef4444 100%);
      border-radius: 0.5rem;
      margin-top: 0.35rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .upstreams-panel {
      position: absolute;
      z-index: 900;
      right: 1rem;
      bottom: 1rem;
      width: min(22rem, 90vw);
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 0.85rem;
      border-radius: 0.4rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .upstreams-panel.hidden {
      display: none;
    }

    .upstreams-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .upstreams-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 16rem;
      overflow-y: auto;
    }

    .upstream-entry {
      padding: 0.45rem 0.55rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .upstream-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.15rem;
    }

    .upstream-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.01em;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .badge-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.available {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }

    .badge.cooldown {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }

    .badge.blocked {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Overpass Proxy Coverage</h1>
    <div class="controls">
      <label>
        View:
        <select id="mode">
          <option value="requests">Request hotspots</option>
          <option value="coverage">Request coverage</option>
          <option value="cache">Cache coverage</option>
        </select>
      </label>
      <button id="refresh">Refresh data</button>
      <button id="toggle-upstreams" aria-pressed="true">Hide upstreams</button>
      <span id="status" class="status">Loading statistics…</span>
    </div>
    <div class="stats" id="summary"></div>
  </header>
  <div id="map"></div>
  <div class="legend">
    <div>Intensity</div>
    <div class="scale"></div>
    <div style="display:flex;justify-content:space-between;gap:0.5rem;margin-top:0.2rem;">
      <span>low</span><span>high</span>
    </div>
  </div>
  <div class="upstreams-panel" aria-live="polite">
    <div class="upstreams-header">
      <span>Upstream status</span>
      <span id="upstream-updated" class="status"></span>
    </div>
    <ul id="upstreams" class="upstreams-list"></ul>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const loadGeohash = async () => {
      if (window.ngeohash?.decode_bbox) return window.ngeohash;

      const cdnSources = [
        'https://cdn.jsdelivr.net/npm/ngeohash@0.6.0/+esm',
        'https://esm.sh/ngeohash@0.6.0'
      ];

      for (const url of cdnSources) {
        try {
          const module = await import(url);
          const geohash = module?.default ?? module;
          if (geohash?.decode_bbox) {
            window.ngeohash = geohash;
            return geohash;
          }
        } catch (error) {
          console.error(`Failed to load ngeohash library from ${url}`, error);
        }
      }

      console.error('Geohash library could not be loaded from any CDN source.');
      return null;
    };

    const geohashReady = loadGeohash();

    const map = L.map('map', {
      worldCopyJump: true,
      minZoom: 0
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      minZoom: 0
    }).addTo(map);

    const overlayGroup = L.layerGroup().addTo(map);
    const modeSelect = document.getElementById('mode');
    const refreshButton = document.getElementById('refresh');
    const toggleUpstreamsButton = document.getElementById('toggle-upstreams');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const upstreamsEl = document.getElementById('upstreams');
    const upstreamUpdatedEl = document.getElementById('upstream-updated');
    const upstreamPanelEl = document.querySelector('.upstreams-panel');
    let latestSnapshot = null;
    let latestCacheCoverage = [];
    let latestGeohashCoverage = [];
    const upstreamPanelStorageKey = 'overpass-proxy.upstreams-panel.visible';

    const demoSnapshot = {
      generatedAt: new Date().toISOString(),
      totalRequests: 12,
      totalCachedTiles: 480,
      cachedAmenities: 1200,
      cacheHitRate: 52.4,
      averageTilesPerRequest: 40,
      cacheStatus: { HIT: 9, MISS: 3, STALE: 0 },
      cacheCoverage: [
        { geohash: 'u33d0', entries: 3, amenityItems: 12 },
        { geohash: 'u0qj0', entries: 2, amenityItems: 6 },
        { geohash: 'dr5r0', entries: 4, amenityItems: 18 }
      ],
      hotspots: [
        { geohash: 'u33d', requests: 4 },
        { geohash: 'u0qj', requests: 3 },
        { geohash: 'dr5r', requests: 5 }
      ],
      upstreams: [
        {
          upstream: 'https://demo-overpass-1.example.com',
          status: 'available',
          reason: 'Healthy',
          requestsToday: 120,
          dayStart: new Date().toISOString(),
          ewmaLatencyMs: 320,
          totalFailures: 1,
          totalRequests: 130
        },
        {
          upstream: 'https://demo-overpass-2.example.com',
          status: 'cooldown',
          reason: 'Recent errors, cooling down',
          requestsToday: 40,
          dayStart: new Date().toISOString(),
          backoffUntil: new Date(Date.now() + 5 * 60 * 1000).toISOString(),
          ewmaLatencyMs: 580,
          totalFailures: 5,
          totalRequests: 55
        }
      ]
    };

    const demoGeohashCoverage = [
      {
        amenity: 'demo',
        geohashCoverage: [
          { geohash: 'u33d', percentage: 30, requests: 4 },
          { geohash: 'u0qj', percentage: 20, requests: 3 },
          { geohash: 'dr5r', percentage: 50, requests: 5 }
        ]
      }
    ];

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const toColor = (ratio) => {
      const hue = (1 - ratio) * 110; // 110 = green, 0 = red
      return `hsl(${hue}, 85%, 55%)`;
    };

    const decodeBbox = async (geohash) => {
      const geohashLib = await geohashReady;
      if (!geohashLib?.decode_bbox) {
        throw new Error('Geohash library not available');
      }
      const [minLat, minLon, maxLat, maxLon] = geohashLib.decode_bbox(geohash);
      return [
        [minLat, minLon],
        [maxLat, minLon],
        [maxLat, maxLon],
        [minLat, maxLon]
      ];
    };

    const clearOverlay = () => {
      overlayGroup.clearLayers();
    };

    const normaliseEntries = (entries) => {
      if (!entries.length) return [];
      const max = Math.max(...entries.map((entry) => entry.value));
      if (max === 0) return [];
      return entries.map((entry) => ({ ...entry, intensity: entry.value / max }));
    };

    const renderOverlay = async (entries, description) => {
      clearOverlay();
      const normalised = normaliseEntries(entries);
      let geohashUnavailable = false;
      for (const entry of normalised) {
        let bbox;
        try {
          bbox = await decodeBbox(entry.geohash);
        } catch (error) {
          console.error(`Failed to decode geohash ${entry.geohash}`, error);
          geohashUnavailable = true;
          continue;
        }
        const polygon = L.polygon(bbox, {
          color: 'transparent',
          weight: 0.3,
          fillColor: toColor(clamp(entry.intensity, 0, 1)),
          fillOpacity: 0.55
        });
        const tooltip = [`${entry.geohash}`, `${description}: ${entry.value.toLocaleString(undefined, {
          maximumFractionDigits: 2
        })}`];
        if (entry.detail) {
          tooltip.push(entry.detail);
        }
        polygon.bindTooltip(tooltip.join('<br>'));
        polygon.addTo(overlayGroup);
      }
      statusEl.textContent = geohashUnavailable
        ? `${description} visualised for ${overlayGroup.getLayers().length} tiles (geohash decoding unavailable for some entries).`
        : `${description} visualised for ${normalised.length} tiles.`;
    };

    const buildRequestEntries = (coverageData) => {
      const counts = new Map();
      for (const amenity of coverageData ?? []) {
        for (const coverage of amenity.geohashCoverage ?? []) {
          counts.set(coverage.geohash, (counts.get(coverage.geohash) ?? 0) + (coverage.requests ?? 0));
        }
      }
      return Array.from(counts.entries()).map(([geohash, value]) => ({ geohash, value }));
    };

    const buildCoverageEntries = (coverageData, totalRequests) => {
      const totals = new Map();
      for (const amenity of coverageData ?? []) {
        for (const coverage of amenity.geohashCoverage ?? []) {
          totals.set(coverage.geohash, (totals.get(coverage.geohash) ?? 0) + (coverage.requests ?? 0));
        }
      }
      return Array.from(totals.entries()).map(([geohash, value]) => ({
        geohash,
        value: totalRequests > 0 ? (value / totalRequests) * 100 : 0
      }));
    };

    const buildCacheCoverageEntries = (cacheCoverage) => {
      return (cacheCoverage ?? []).map((entry) => ({
        geohash: entry.geohash,
        value: Math.max(0, entry.amenityItems ?? 0),
        detail:
          entry.entries !== undefined
            ? `Tile entries: ${entry.entries.toLocaleString(undefined, { maximumFractionDigits: 2 })}`
            : undefined
      }));
    };

    const updateSummary = (snapshot) => {
      summaryEl.innerHTML = '';
      const parts = [
        { label: 'Total requests', value: snapshot.totalRequests },
        { label: 'Unique clients', value: snapshot.totalUniqueClients },
        { label: 'Cached tiles', value: snapshot.totalCachedTiles },
        { label: 'Cache hit rate', value: `${snapshot.cacheHitRate ?? 0}%` },
        { label: 'Avg tiles/request', value: snapshot.averageTilesPerRequest }
      ];

      for (const part of parts) {
        if (part.value === undefined || part.value === null) continue;
        const stat = document.createElement('div');
        stat.className = 'stat';
        stat.innerHTML = `<span>${part.label}</span><strong>${part.value}</strong>`;
        summaryEl.appendChild(stat);
      }
    };

    const renderUpstreams = (snapshot) => {
      upstreamsEl.innerHTML = '';
      const upstreams = snapshot?.upstreams ?? [];
      upstreamUpdatedEl.textContent = snapshot?.generatedAt
        ? new Date(snapshot.generatedAt).toLocaleTimeString()
        : '';

      if (!upstreams.length) {
        const empty = document.createElement('li');
        empty.className = 'status';
        empty.textContent = 'No upstream data available';
        upstreamsEl.appendChild(empty);
        return;
      }

      for (const entry of upstreams) {
        const item = document.createElement('li');
        item.className = 'upstream-entry';

        const badge = document.createElement('span');
        badge.className = `badge ${entry.status ?? 'available'}`;
        badge.innerHTML = `<span class="badge-dot"></span>${entry.status ?? 'available'}`;

        const title = document.createElement('div');
        title.className = 'upstream-title';
        title.innerHTML = `<span>${entry.upstream}</span>`;
        title.appendChild(badge);

        const meta = document.createElement('div');
        meta.className = 'upstream-meta';

        const reason = document.createElement('div');
        reason.textContent = entry.reason ?? 'No status message';
        meta.appendChild(reason);

        const counters = [
          entry.requestsToday !== undefined
            ? `Requests today: ${entry.requestsToday.toLocaleString()}`
            : null,
          entry.totalRequests !== undefined
            ? `Total: ${entry.totalRequests.toLocaleString()}`
            : null,
          entry.totalFailures !== undefined
            ? `Failures: ${entry.totalFailures.toLocaleString()}`
            : null
        ].filter(Boolean);

        const timers = [
          entry.backoffUntil ? `Backoff until ${new Date(entry.backoffUntil).toLocaleTimeString()}` : null,
          entry.blockedUntil ? `Blocked until ${new Date(entry.blockedUntil).toLocaleDateString()}` : null
        ].filter(Boolean);

        if (counters.length) {
          const countersRow = document.createElement('div');
          countersRow.textContent = counters.join(' · ');
          meta.appendChild(countersRow);
        }

        if (entry.ewmaLatencyMs !== undefined) {
          const latency = document.createElement('div');
          latency.textContent = `EWMA latency: ${entry.ewmaLatencyMs.toLocaleString()} ms`;
          meta.appendChild(latency);
        }

        if (timers.length) {
          const timersRow = document.createElement('div');
          timersRow.textContent = timers.join(' · ');
          meta.appendChild(timersRow);
        }

        item.appendChild(title);
        item.appendChild(meta);
        upstreamsEl.appendChild(item);
      }
    };

    const setUpstreamPanelVisibility = (visible) => {
      if (visible) {
        upstreamPanelEl.classList.remove('hidden');
        toggleUpstreamsButton.textContent = 'Hide upstreams';
      } else {
        upstreamPanelEl.classList.add('hidden');
        toggleUpstreamsButton.textContent = 'Show upstreams';
      }
      toggleUpstreamsButton.setAttribute('aria-pressed', String(visible));
      localStorage.setItem(upstreamPanelStorageKey, JSON.stringify(visible));
    };

    const applyMode = async () => {
      if (!latestSnapshot) return;
      const mode = modeSelect.value;
      const coverageData =
        latestGeohashCoverage?.length > 0 ? latestGeohashCoverage : demoGeohashCoverage;
      const totalRequests = latestSnapshot?.totalRequests ?? demoSnapshot.totalRequests ?? 0;

      if (mode === 'coverage') {
        await renderOverlay(buildCoverageEntries(coverageData, totalRequests), 'Request share (%)');
      } else if (mode === 'cache') {
        const cacheCoverageData =
          latestCacheCoverage?.length > 0
            ? latestCacheCoverage
            : demoSnapshot.cacheCoverage ?? [];
        await renderOverlay(buildCacheCoverageEntries(cacheCoverageData), 'Cached amenities');
      } else {
        await renderOverlay(buildRequestEntries(coverageData), 'Requests');
      }
    };

    const fetchStatistics = async () => {
      try {
        const response = await fetch('/api/statistics', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestSnapshot = snapshot;
        statusEl.textContent = `Updated at ${new Date(snapshot.generatedAt ?? Date.now()).toLocaleString()}`;
        renderUpstreams(snapshot);
      } catch (error) {
        console.error('Failed to load live statistics, falling back to demo data.', error);
        latestSnapshot = demoSnapshot;
        latestCacheCoverage = demoSnapshot.cacheCoverage ?? [];
        latestGeohashCoverage = demoGeohashCoverage;
        statusEl.textContent = 'Using demo data (live fetch failed).';
        renderUpstreams(demoSnapshot);
      }
    };

    const fetchCacheCoverage = async () => {
      try {
        const response = await fetch('/api/statistics/cacheCoverage', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestCacheCoverage = snapshot.cacheCoverage ?? [];
      } catch (error) {
        console.error('Failed to load cache coverage data, falling back to demo data.', error);
        if (!latestCacheCoverage?.length) {
          latestCacheCoverage = demoSnapshot.cacheCoverage ?? [];
        }
      }
    };

    const fetchGeohashCoverage = async () => {
      try {
        const response = await fetch('/api/statistics/geohashCoverage', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestGeohashCoverage = snapshot.geohashCoverage ?? [];
      } catch (error) {
        console.error('Failed to load geohash coverage data, falling back to demo data.', error);
        if (!latestGeohashCoverage?.length) {
          latestGeohashCoverage = demoGeohashCoverage;
        }
      }
    };

    const refreshData = async () => {
      statusEl.textContent = 'Loading statistics…';
      await Promise.all([fetchStatistics(), fetchCacheCoverage(), fetchGeohashCoverage()]);
      updateSummary(latestSnapshot);
      await applyMode();
    };

    modeSelect.addEventListener('change', () => {
      void applyMode();
    });
    refreshButton.addEventListener('click', () => {
      void refreshData();
    });
    toggleUpstreamsButton.addEventListener('click', () => {
      const isVisible = upstreamPanelEl.classList.contains('hidden') ? false : true;
      setUpstreamPanelVisibility(!isVisible);
    });

    const storedVisibility = localStorage.getItem(upstreamPanelStorageKey);
    setUpstreamPanelVisibility(storedVisibility === null ? true : JSON.parse(storedVisibility));

    refreshData();
  </script>
</body>
</html>
