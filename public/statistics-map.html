<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overpass Proxy Statistics Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light dark;
      --panel-bg: rgba(0, 0, 0, 0.65);
      --panel-text: #fff;
      --accent: #ff6b35;
      --muted: #9ca3af;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: #0f172a;
      color: var(--panel-text);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0b1220;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--panel-text);
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #1f2937;
    }

    button:active {
      transform: translateY(1px);
    }

    #map {
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 14rem;
    }

    .progress-wrapper.hidden {
      display: none;
    }

    .progress-track {
      width: clamp(10rem, 25vw, 16rem);
      height: 0.55rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34d399, #60a5fa, #f472b6);
      transition: width 200ms ease;
    }

    .progress-label {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 8rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem 0.75rem;
      border-radius: 0.35rem;
    }

    .stat strong {
      color: var(--panel-text);
      font-size: 1.05rem;
    }

    .legend {
      position: absolute;
      z-index: 900;
      bottom: 1rem;
      left: 1rem;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 0.65rem 0.8rem;
      border-radius: 0.4rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    .legend .scale {
      height: 0.75rem;
      width: 9rem;
      background: linear-gradient(90deg, #2dd36f 0%, #fbbf24 50%, #ef4444 100%);
      border-radius: 0.5rem;
      margin-top: 0.35rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .upstreams-panel {
      position: absolute;
      z-index: 900;
      right: 1rem;
      bottom: 1rem;
      width: min(32rem, 96vw);
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 0.85rem;
      border-radius: 0.4rem;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .upstreams-panel.hidden {
      display: none;
    }

    .upstreams-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .upstreams-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 16rem;
      overflow-y: auto;
    }

    .upstream-entry {
      padding: 0.45rem 0.55rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .upstream-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.15rem;
    }

    .upstream-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.01em;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .badge-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.available {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }

    .badge.cooldown {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }

    .badge.blocked {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Overpass Proxy Coverage</h1>
    <div class="controls">
      <label>
        View:
        <select id="mode">
          <option value="requests">Request hotspots</option>
          <option value="coverage">Request coverage</option>
          <option value="cache">Cache coverage</option>
        </select>
      </label>
      <button id="refresh">Refresh data</button>
      <button id="toggle-upstreams" aria-pressed="true">Hide upstreams</button>
      <span id="status" class="status">Loading statistics…</span>
      <div id="progress" class="progress-wrapper hidden" role="status" aria-live="polite">
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-label" class="progress-label">Preparing…</span>
      </div>
    </div>
    <div class="stats" id="summary"></div>
  </header>
  <div id="map"></div>
  <div class="legend">
    <div>Intensity</div>
    <div class="scale"></div>
    <div style="display:flex;justify-content:space-between;gap:0.5rem;margin-top:0.2rem;">
      <span>low</span><span>high</span>
    </div>
  </div>
  <div class="upstreams-panel" aria-live="polite">
    <div class="upstreams-header">
      <span>Upstream status</span>
      <span id="upstream-updated" class="status"></span>
    </div>
    <ul id="upstreams" class="upstreams-list"></ul>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const loadGeohash = async () => {
      if (window.ngeohash?.decode_bbox) return window.ngeohash;

      const cdnSources = [
        'https://cdn.jsdelivr.net/npm/ngeohash@0.6.0/+esm',
        'https://esm.sh/ngeohash@0.6.0'
      ];

      for (const url of cdnSources) {
        try {
          const module = await import(url);
          const geohash = module?.default ?? module;
          if (geohash?.decode_bbox) {
            window.ngeohash = geohash;
            return geohash;
          }
        } catch (error) {
          console.error(`Failed to load ngeohash library from ${url}`, error);
        }
      }

      console.error('Geohash library could not be loaded from any CDN source.');
      return null;
    };

    const geohashReady = loadGeohash();

    const map = L.map('map', {
      worldCopyJump: true,
      minZoom: 0
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      minZoom: 0
    }).addTo(map);

    const overlayGroup = L.layerGroup().addTo(map);
    const modeSelect = document.getElementById('mode');
    const refreshButton = document.getElementById('refresh');
    const toggleUpstreamsButton = document.getElementById('toggle-upstreams');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const upstreamsEl = document.getElementById('upstreams');
    const upstreamUpdatedEl = document.getElementById('upstream-updated');
    const upstreamPanelEl = document.querySelector('.upstreams-panel');
    const progressEl = document.getElementById('progress');
    const progressBarEl = document.getElementById('progress-bar');
    const progressLabelEl = document.getElementById('progress-label');
    let latestSnapshot = null;
    let latestCacheCoverage = [];
    let latestGeohashCoverage = [];
    const geohashBoundsCache = new Map();
    const upstreamPanelStorageKey = 'overpass-proxy.upstreams-panel.visible';

    const demoSnapshot = {
      generatedAt: new Date().toISOString(),
      totalRequests: 12,
      totalCachedTiles: 480,
      cachedAmenities: 1200,
      cacheHitRate: 52.4,
      averageTilesPerRequest: 40,
      cacheStatus: { HIT: 9, MISS: 3, STALE: 0 },
      cacheCoverage: [
        { geohash: 'u33d0', entries: 3, amenityItems: 12, staleEntries: 0, staleAmenityItems: 0 },
        { geohash: 'u0qj0', entries: 1, amenityItems: 6, staleEntries: 1, staleAmenityItems: 6 },
        { geohash: 'dr5r0', entries: 2, amenityItems: 12, staleEntries: 2, staleAmenityItems: 12 }
      ],
      hotspots: [
        { geohash: 'u33d', requests: 4 },
        { geohash: 'u0qj', requests: 3 },
        { geohash: 'dr5r', requests: 5 }
      ],
      upstreams: [
        {
          upstream: 'https://demo-overpass-1.example.com',
          status: 'available',
          reason: 'Healthy',
          requestsToday: 120,
          dayStart: new Date().toISOString(),
          ewmaLatencyMs: 320,
          totalFailures: 1,
          totalRequests: 130
        },
        {
          upstream: 'https://demo-overpass-2.example.com',
          status: 'cooldown',
          reason: 'Recent errors, cooling down',
          requestsToday: 40,
          dayStart: new Date().toISOString(),
          backoffUntil: new Date(Date.now() + 5 * 60 * 1000).toISOString(),
          ewmaLatencyMs: 580,
          totalFailures: 5,
          totalRequests: 55
        }
      ]
    };

    const demoGeohashCoverage = [
      {
        amenity: 'demo',
        geohashCoverage: [
          { geohash: 'u33d', percentage: 30, requests: 4 },
          { geohash: 'u0qj', percentage: 20, requests: 3 },
          { geohash: 'dr5r', percentage: 50, requests: 5 }
        ]
      }
    ];

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const updateProgress = (value, label) => {
      const safeValue = clamp(Number.isFinite(value) ? value : 0, 0, 1);
      progressBarEl.style.width = `${Math.round(safeValue * 100)}%`;
      if (label) {
        progressLabelEl.textContent = label;
      }
    };

    const showProgress = (label) => {
      progressEl.classList.remove('hidden');
      updateProgress(0, label ?? 'Preparing…');
    };

    const hideProgress = (label) => {
      updateProgress(1, label ?? 'Ready');
      window.setTimeout(() => progressEl.classList.add('hidden'), 250);
    };

    const toColor = (ratio) => {
      const hue = (1 - ratio) * 110; // 110 = green, 0 = red
      return `hsl(${hue}, 85%, 55%)`;
    };

    const approxEqual = (a, b, epsilon = 1e-10) => Math.abs(a - b) <= epsilon;

    const condenseEntries = (entries) => {
      const condensed = new Map();

      for (const entry of entries ?? []) {
        if (!entry?.geohash) continue;

        const key = `${entry.geohash}|${entry.color ?? 'default'}`;
        const value = Number.isFinite(entry.value) ? entry.value : 0;
        const weight = Math.max(value, 1);
        const detailParts = entry.detail ? [entry.detail] : [];

        if (!condensed.has(key)) {
          condensed.set(key, {
            ...entry,
            value,
            detailParts,
            weight,
            staleRatio: entry.staleRatio ?? undefined
          });
          continue;
        }

        const bucket = condensed.get(key);
        bucket.value += value;
        bucket.weight += weight;
        bucket.detailParts.push(...detailParts);

        if (bucket.staleRatio !== undefined || entry.staleRatio !== undefined) {
          const left = (bucket.staleRatio ?? 0) * (bucket.weight - weight);
          const right = (entry.staleRatio ?? 0) * weight;
          bucket.staleRatio = bucket.weight > 0 ? (left + right) / bucket.weight : bucket.staleRatio;
        }
      }

      return Array.from(condensed.values()).map((bucket) => {
        const { detailParts, weight, ...rest } = bucket;
        return {
          ...rest,
          detail: detailParts.length ? Array.from(new Set(detailParts)).join(' | ') : undefined
        };
      });
    };

    const mergeHorizontally = (tiles, canMergeEntries, mergeEntries) => {
      const rows = new Map();
      for (const tile of tiles) {
        const key = `${tile.bounds.south.toFixed(10)}|${tile.bounds.north.toFixed(10)}`;
        rows.set(key, [...(rows.get(key) ?? []), tile]);
      }

      const mergedRows = [];
      for (const row of rows.values()) {
        const sorted = [...row].sort((a, b) => a.bounds.west - b.bounds.west);
        let current = sorted[0];
        for (const next of sorted.slice(1)) {
          if (approxEqual(current.bounds.east, next.bounds.west) && canMergeEntries(current, next)) {
            const mergedEntry = mergeEntries(current, next);
            current = {
              ...current,
              bounds: { ...current.bounds, east: next.bounds.east },
              geohashes: [...current.geohashes, ...next.geohashes],
              entry: mergedEntry.entry,
              weight: mergedEntry.weight
            };
          } else {
            mergedRows.push(current);
            current = next;
          }
        }
        mergedRows.push(current);
      }

      return mergedRows;
    };

    const mergeVertically = (tiles, canMergeEntries, mergeEntries) => {
      const columns = new Map();
      for (const tile of tiles) {
        const key = `${tile.bounds.west.toFixed(10)}|${tile.bounds.east.toFixed(10)}`;
        columns.set(key, [...(columns.get(key) ?? []), tile]);
      }

      const mergedColumns = [];
      for (const column of columns.values()) {
        const sorted = [...column].sort((a, b) => a.bounds.south - b.bounds.south);
        let current = sorted[0];
        for (const next of sorted.slice(1)) {
          if (approxEqual(current.bounds.north, next.bounds.south) && canMergeEntries(current, next)) {
            const mergedEntry = mergeEntries(current, next);
            current = {
              ...current,
              bounds: { ...current.bounds, north: next.bounds.north },
              geohashes: [...current.geohashes, ...next.geohashes],
              entry: mergedEntry.entry,
              weight: mergedEntry.weight
            };
          } else {
            mergedColumns.push(current);
            current = next;
          }
        }
        mergedColumns.push(current);
      }

      return mergedColumns;
    };

    const mergeTileSurfaces = (
      tiles,
      canMergeEntries,
      mergeEntries,
      { onProgress, progressBase = 0, progressSpan = 0 } = {}
    ) => {
      let current = tiles;
      let iterations = 0;
      const safeSpan = Math.max(0, progressSpan);
      const maxIterations = Math.max(1, tiles.length);

      const reportProgress = () => {
        if (!onProgress || safeSpan === 0) return;
        const fraction = Math.min(1, iterations / maxIterations);
        onProgress(progressBase + fraction * safeSpan, 'Optimising tiles…');
      };

      reportProgress();
      while (true) {
        const horizontalFirst = mergeVertically(
          mergeHorizontally(current, canMergeEntries, mergeEntries),
          canMergeEntries,
          mergeEntries
        );
        const verticalFirst = mergeHorizontally(
          mergeVertically(current, canMergeEntries, mergeEntries),
          canMergeEntries,
          mergeEntries
        );

        const merged =
          horizontalFirst.length <= verticalFirst.length ? horizontalFirst : verticalFirst;

        if (merged.length === current.length) {
          reportProgress();
          return merged;
        }

        current = merged;
        iterations += 1;
        reportProgress();
      }
    };

    const buildMergedTiles = async (entries, maxValue, onProgress) => {
      const tilesByValue = new Map();
      let failedGeohashes = 0;
      const totalEntries = entries.length || 1;
      let processedEntries = 0;

      const mergeDetails = (left, right) => {
        const detailParts = [left.entry?.detail, right.entry?.detail].filter(Boolean);
        return detailParts.length ? Array.from(new Set(detailParts)).join(' | ') : undefined;
      };

      const canMergeEntries = (left, right) => {
        const leftColor = left.entry?.color;
        const rightColor = right.entry?.color;
        if (leftColor && rightColor && leftColor !== rightColor) return false;

        const leftValue = Number(left.entry?.value ?? 0);
        const rightValue = Number(right.entry?.value ?? 0);
        const max = Math.max(Math.abs(leftValue), Math.abs(rightValue));
        if (max === 0) return true;
        return Math.abs(leftValue - rightValue) / max <= 0.2;
      };

      const canStrictlyMergeEntries = (left, right) => {
        const leftColor = left.entry?.color ?? 'default';
        const rightColor = right.entry?.color ?? 'default';
        if (leftColor !== rightColor) return false;

        const leftValue = Number(left.entry?.value ?? 0);
        const rightValue = Number(right.entry?.value ?? 0);
        return approxEqual(leftValue, rightValue, 1e-6);
      };

      const mergeEntries = (left, right) => {
        const leftWeight = left.weight ?? 1;
        const rightWeight = right.weight ?? 1;
        const totalWeight = leftWeight + rightWeight;
        const value =
          ((Number(left.entry?.value ?? 0) * leftWeight + Number(right.entry?.value ?? 0) * rightWeight) /
            totalWeight) || 0;
        const detail = mergeDetails(left, right);
        const color = left.entry?.color ?? right.entry?.color;
        const intensity =
          maxValue > 0
            ? value / maxValue
            : ((Number(left.entry?.intensity ?? 0) * leftWeight +
                Number(right.entry?.intensity ?? 0) * rightWeight) /
                totalWeight) || 0;

        return {
          entry: {
            ...left.entry,
            value,
            intensity,
            detail,
            color
          },
          weight: totalWeight
        };
      };

      const mergeEntriesBySumming = (left, right) => {
        const leftWeight = left.weight ?? 1;
        const rightWeight = right.weight ?? 1;
        const totalWeight = leftWeight + rightWeight;
        const value = Number(left.entry?.value ?? 0) + Number(right.entry?.value ?? 0);

        const staleRatio = (() => {
          const leftStale = (left.entry?.staleRatio ?? 0) * leftWeight;
          const rightStale = (right.entry?.staleRatio ?? 0) * rightWeight;
          return totalWeight > 0 ? (leftStale + rightStale) / totalWeight : undefined;
        })();

        return {
          entry: {
            ...left.entry,
            value,
            intensity: maxValue > 0 ? value / maxValue : left.entry?.intensity ?? right.entry?.intensity ?? 0,
            detail: mergeDetails(left, right),
            color: left.entry?.color ?? right.entry?.color,
            staleRatio: staleRatio === undefined ? undefined : staleRatio
          },
          weight: totalWeight
        };
      };

      for (const entry of entries) {
        try {
          const bounds = await decodeBounds(entry.geohash);
          const key = entry.color ?? 'default';
          const surfaces = tilesByValue.get(key) ?? [];
          surfaces.push({ bounds, geohashes: [entry.geohash], entry, weight: 1 });
          tilesByValue.set(key, surfaces);
        } catch (error) {
          console.error(`Failed to decode geohash ${entry.geohash}`, error);
          failedGeohashes += 1;
        }

        processedEntries += 1;
        if (processedEntries % 100 === 0) {
          onProgress?.(0.4 + (processedEntries / totalEntries) * 0.25, 'Decoding geohashes…');
        }
      }

      const mergedTiles = [];
      const mergeGroups = Array.from(tilesByValue.values());
      const totalGroups = mergeGroups.length || 1;
      let mergedGroups = 0;

      for (const group of mergeGroups) {
        const groupProgressBase = 0.7 + (mergedGroups / totalGroups) * 0.2;
        const groupProgressSpan = 0.2 / totalGroups;
        const strictlyMerged = mergeTileSurfaces(group, canStrictlyMergeEntries, mergeEntriesBySumming, {
          onProgress,
          progressBase: groupProgressBase,
          progressSpan: groupProgressSpan / 2
        });
        mergedTiles.push(
          ...mergeTileSurfaces(strictlyMerged, canMergeEntries, mergeEntries, {
            onProgress,
            progressBase: groupProgressBase + groupProgressSpan / 2,
            progressSpan: groupProgressSpan / 2
          })
        );
        mergedGroups += 1;
        onProgress?.(0.7 + (mergedGroups / totalGroups) * 0.2, 'Optimising tiles…');
      }

      onProgress?.(0.95, 'Finishing up…');

      return { tiles: mergedTiles, failedGeohashes };
    };

    const decodeBounds = async (geohash) => {
      const cached = geohashBoundsCache.get(geohash);
      if (cached) return cached;

      const geohashLib = await geohashReady;
      if (!geohashLib?.decode_bbox) {
        throw new Error('Geohash library not available');
      }
      const [south, west, north, east] = geohashLib.decode_bbox(geohash);
      const bounds = { south, west, north, east };
      geohashBoundsCache.set(geohash, bounds);
      return bounds;
    };

    const boundsToPolygon = (bounds) => [
      [bounds.south, bounds.west],
      [bounds.north, bounds.west],
      [bounds.north, bounds.east],
      [bounds.south, bounds.east]
    ];

    const clearOverlay = () => {
      overlayGroup.clearLayers();
    };

    const normaliseEntries = (entries) => {
      if (!entries.length) return { entries: [], max: 0 };

      let max = 0;
      for (const entry of entries) {
        const value = Number.isFinite(entry.value) ? entry.value : 0;
        max = Math.max(max, value);
      }

      if (max === 0) return { entries: [], max };

      return {
        entries: entries.map((entry) => ({
          ...entry,
          intensity: (Number.isFinite(entry.value) ? entry.value : 0) / max
        })),
        max
      };
    };

    const renderOverlay = async (entries, description) => {
      showProgress('Optimising overlay…');
      try {
        clearOverlay();
        const condensed = condenseEntries(entries);
        updateProgress(0.15, 'Normalising values…');
        const normalised = normaliseEntries(condensed);
        updateProgress(0.3, 'Dekodiere Geohashes…');
        const { tiles, failedGeohashes } = await buildMergedTiles(normalised.entries, normalised.max, updateProgress);

        for (const tile of tiles) {
          const polygon = L.polygon(boundsToPolygon(tile.bounds), {
            color: 'transparent',
            weight: 0.3,
            fillColor: tile.entry.color ?? toColor(clamp(tile.entry.intensity ?? 0, 0, 1)),
            fillOpacity: 0.55
          });
          const geohashLabel = tile.geohashes.length === 1 ? tile.geohashes[0] : `${tile.geohashes.length} tiles`;
          const tooltip = [geohashLabel];
          if (tile.entry.statusLabel) {
            tooltip.push(tile.entry.statusLabel);
          } else {
            tooltip.push(`${description}: ${tile.entry.value.toLocaleString(undefined, { maximumFractionDigits: 2 })}`);
          }
          if (tile.entry.detail) tooltip.push(tile.entry.detail);
          polygon.bindTooltip(tooltip.join('<br>'));
          polygon.addTo(overlayGroup);
        }
        const mergedText =
          tiles.length === normalised.entries.length
            ? `${tiles.length} tiles.`
            : `${tiles.length} merged tiles (from ${normalised.entries.length}).`;
        statusEl.textContent = failedGeohashes > 0
          ? `${description} visualised for ${tiles.length} tiles (geohash decoding unavailable for some entries).`
          : `${description} visualised for ${mergedText}`;
      } finally {
        hideProgress('Ready');
      }
    };

    const buildRequestEntries = (coverageData) => {
      const counts = new Map();
      for (const amenity of coverageData ?? []) {
        for (const coverage of amenity.geohashCoverage ?? []) {
          counts.set(coverage.geohash, (counts.get(coverage.geohash) ?? 0) + (coverage.requests ?? 0));
        }
      }
      return Array.from(counts.entries()).map(([geohash, value]) => ({ geohash, value }));
    };

    const buildCoverageEntries = (coverageData, totalRequests) => {
      const totals = new Map();
      for (const amenity of coverageData ?? []) {
        for (const coverage of amenity.geohashCoverage ?? []) {
          totals.set(coverage.geohash, (totals.get(coverage.geohash) ?? 0) + (coverage.requests ?? 0));
        }
      }
      return Array.from(totals.entries()).map(([geohash, value]) => ({
        geohash,
        value: totalRequests > 0 ? (value / totalRequests) * 100 : 0
      }));
    };

    const buildCacheCoverageEntries = (cacheCoverage) => {
      return (cacheCoverage ?? [])
        .map((entry) => {
          const freshEntries = Math.max(0, entry.entries ?? 0);
          const staleEntries = Math.max(0, entry.staleEntries ?? 0);
          const totalEntries = freshEntries + staleEntries;
          const hasStaleEntries = staleEntries > 0;

          if (totalEntries === 0) return null;

          return {
            geohash: entry.geohash,
            value: 1,
            color: hasStaleEntries ? '#4ea8de' : '#34d399',
            statusLabel: hasStaleEntries ? 'Cache: stale' : 'Cache: fresh'
          };
        })
        .filter(Boolean);
    };

    const updateSummary = (snapshot) => {
      summaryEl.innerHTML = '';
      const parts = [
        { label: 'Total requests', value: snapshot.totalRequests },
        { label: 'Unique clients', value: snapshot.totalUniqueClients },
        { label: 'Cached tiles', value: snapshot.totalCachedTiles },
        { label: 'Cache hit rate', value: `${snapshot.cacheHitRate ?? 0}%` },
        { label: 'Avg tiles/request', value: snapshot.averageTilesPerRequest }
      ];

      for (const part of parts) {
        if (part.value === undefined || part.value === null) continue;
        const stat = document.createElement('div');
        stat.className = 'stat';
        stat.innerHTML = `<span>${part.label}</span><strong>${part.value}</strong>`;
        summaryEl.appendChild(stat);
      }
    };

    const renderUpstreams = (snapshot) => {
      upstreamsEl.innerHTML = '';
      const upstreams = snapshot?.upstreams ?? [];
      upstreamUpdatedEl.textContent = snapshot?.generatedAt
        ? new Date(snapshot.generatedAt).toLocaleTimeString()
        : '';

      if (!upstreams.length) {
        const empty = document.createElement('li');
        empty.className = 'status';
        empty.textContent = 'No upstream data available';
        upstreamsEl.appendChild(empty);
        return;
      }

      for (const entry of upstreams) {
        const item = document.createElement('li');
        item.className = 'upstream-entry';

        const badge = document.createElement('span');
        badge.className = `badge ${entry.status ?? 'available'}`;
        badge.innerHTML = `<span class="badge-dot"></span>${entry.status ?? 'available'}`;

        const title = document.createElement('div');
        title.className = 'upstream-title';
        title.innerHTML = `<span>${entry.upstream}</span>`;
        title.appendChild(badge);

        const meta = document.createElement('div');
        meta.className = 'upstream-meta';

        const reason = document.createElement('div');
        reason.textContent = entry.reason ?? 'No status message';
        meta.appendChild(reason);

        const counters = [
          entry.requestsToday !== undefined
            ? `Requests today: ${entry.requestsToday.toLocaleString()}`
            : null,
          entry.totalRequests !== undefined
            ? `Total: ${entry.totalRequests.toLocaleString()}`
            : null,
          entry.totalFailures !== undefined
            ? `Failures: ${entry.totalFailures.toLocaleString()}`
            : null
        ].filter(Boolean);

        const timers = [
          entry.backoffUntil ? `Backoff until ${new Date(entry.backoffUntil).toLocaleTimeString()}` : null,
          entry.blockedUntil ? `Blocked until ${new Date(entry.blockedUntil).toLocaleDateString()}` : null
        ].filter(Boolean);

        if (counters.length) {
          const countersRow = document.createElement('div');
          countersRow.textContent = counters.join(' · ');
          meta.appendChild(countersRow);
        }

        if (entry.ewmaLatencyMs !== undefined) {
          const latency = document.createElement('div');
          latency.textContent = `EWMA latency: ${entry.ewmaLatencyMs.toLocaleString()} ms`;
          meta.appendChild(latency);
        }

        if (timers.length) {
          const timersRow = document.createElement('div');
          timersRow.textContent = timers.join(' · ');
          meta.appendChild(timersRow);
        }

        item.appendChild(title);
        item.appendChild(meta);
        upstreamsEl.appendChild(item);
      }
    };

    const setUpstreamPanelVisibility = (visible) => {
      if (visible) {
        upstreamPanelEl.classList.remove('hidden');
        toggleUpstreamsButton.textContent = 'Hide upstreams';
      } else {
        upstreamPanelEl.classList.add('hidden');
        toggleUpstreamsButton.textContent = 'Show upstreams';
      }
      toggleUpstreamsButton.setAttribute('aria-pressed', String(visible));
      localStorage.setItem(upstreamPanelStorageKey, JSON.stringify(visible));
    };

    const applyMode = async () => {
      if (!latestSnapshot) return;
      const mode = modeSelect.value;
      const coverageData =
        latestGeohashCoverage?.length > 0 ? latestGeohashCoverage : demoGeohashCoverage;
      const totalRequests = latestSnapshot?.totalRequests ?? demoSnapshot.totalRequests ?? 0;

      if (mode === 'coverage') {
        await renderOverlay(buildCoverageEntries(coverageData, totalRequests), 'Request share (%)');
      } else if (mode === 'cache') {
        const cacheCoverageData =
          latestCacheCoverage?.length > 0
            ? latestCacheCoverage
            : demoSnapshot.cacheCoverage ?? [];
        await renderOverlay(buildCacheCoverageEntries(cacheCoverageData), 'Cache status');
      } else {
        await renderOverlay(buildRequestEntries(coverageData), 'Requests');
      }
    };

    const fetchStatistics = async () => {
      try {
        const response = await fetch('/api/statistics', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestSnapshot = snapshot;
        statusEl.textContent = `Updated at ${new Date(snapshot.generatedAt ?? Date.now()).toLocaleString()}`;
        renderUpstreams(snapshot);
      } catch (error) {
        console.error('Failed to load live statistics, falling back to demo data.', error);
        latestSnapshot = demoSnapshot;
        latestCacheCoverage = demoSnapshot.cacheCoverage ?? [];
        latestGeohashCoverage = demoGeohashCoverage;
        statusEl.textContent = 'Using demo data (live fetch failed).';
        renderUpstreams(demoSnapshot);
      }
    };

    const fetchCacheCoverage = async () => {
      try {
        const response = await fetch('/api/statistics/cacheCoverage', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestCacheCoverage = snapshot.cacheCoverage ?? [];
      } catch (error) {
        console.error('Failed to load cache coverage data, falling back to demo data.', error);
        if (!latestCacheCoverage?.length) {
          latestCacheCoverage = demoSnapshot.cacheCoverage ?? [];
        }
      }
    };

    const fetchGeohashCoverage = async () => {
      try {
        const response = await fetch('/api/statistics/geohashCoverage', { cache: 'no-store' });
        if (!response.ok) throw new Error('Request failed');
        const snapshot = await response.json();
        latestGeohashCoverage = snapshot.geohashCoverage ?? [];
      } catch (error) {
        console.error('Failed to load geohash coverage data, falling back to demo data.', error);
        if (!latestGeohashCoverage?.length) {
          latestGeohashCoverage = demoGeohashCoverage;
        }
      }
    };

    const refreshData = async () => {
      statusEl.textContent = 'Loading statistics…';
      await Promise.all([fetchStatistics(), fetchCacheCoverage(), fetchGeohashCoverage()]);
      updateSummary(latestSnapshot);
      await applyMode();
    };

    modeSelect.addEventListener('change', () => {
      void applyMode();
    });
    refreshButton.addEventListener('click', () => {
      void refreshData();
    });
    toggleUpstreamsButton.addEventListener('click', () => {
      const isVisible = upstreamPanelEl.classList.contains('hidden') ? false : true;
      setUpstreamPanelVisibility(!isVisible);
    });

    const storedVisibility = localStorage.getItem(upstreamPanelStorageKey);
    setUpstreamPanelVisibility(storedVisibility === null ? true : JSON.parse(storedVisibility));

    refreshData();
  </script>
</body>
</html>
